# Site statique : aucune étape de build, on publie le dossier tel quel.
[build]
  publish = "maquette"
  command = ""

# Les visuels et vidéos portent un nom stable : on les met en cache longtemps.
# Si une image change, renommer le fichier (ex. p-moto-1-v2.webp).
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le JS contient le catalogue : il doit être revalidé à chaque visite,
# sinon une mise à jour de prix mettrait un an à se propager.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
